<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patinhas e Amigos - Login</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>

</head>


<body>


    <!-- CABEÇALHO -->

    <header>

        <div class="nav-container">

            <a href="index.html" class="logo">
                🐾 Patinhas e Amigos
            </a>


            <ul class="nav-links">

                <li>
                    <a href="index.html" class="nav-link">
                        Início
                    </a>
                </li>

                <li>
                    <a href="adocao.html" class="nav-link">
                        Adoção
                    </a>
                </li>

                <li>
                    <a href="doacao.html" class="nav-link">
                        Doações
                    </a>
                </li>

                <li>
                    <a href="login.html" class="nav-link active">
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </header>



    <!-- LOGIN -->

    <main>


        <div class="login-container">

            <h2>
                Área do Usuário
            </h2>

            <br>


            <form onsubmit="fazerLogin(event)">


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="btn"
                    style="width: 100%;"
                >
                    Entrar
                </button>


            </form>


            <p style="margin-top: 1rem; text-align: center;">

                <a href="index.html">
                    ← Voltar para o início
                </a>

            </p>


        </div>


    </main>



    <!-- RODAPÉ -->

    <footer>

        <p>
            &copy; 2026 ONG Patinhas e Amigos -
            Todos os direitos reservados.
        </p>

    </footer>


</body>

</html>
